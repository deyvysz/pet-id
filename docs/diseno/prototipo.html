<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{height:100%}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Pet ID prototipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: página de inicio a todo el ancho (máx. 1120px); pantallas de la app en una columna de teléfono (máx. 480px). Estilo tomado del diseño de inicio: verde agua y azul marino, tarjetas redondeadas, botones en píldora. */
:root{
  --bg:#EEF6F5; --surface:#FFFFFF; --sunk:#F2F8F7; --ink:#0A2346; --muted:#4D5E74; --line:#D3E3E1;
  --brand:#0D7F76; --brand-ink:#FFFFFF; --accent:#1FB5A3; --accent-ink:#0A2346; --accent-soft:#E2F5F2; --mint:#C9EEEA;
  --lost:#B42318; --lost-soft:#FDECEA; --ok:#12795A; --ok-soft:#E1F4EC; --warn:#9A4A06; --warn-soft:#FEF0C7;
  --f-display:"Poppins", "Segoe UI", system-ui, sans-serif;
  --f-body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:16px; --shadow:0 6px 24px rgba(10,35,70,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#081620; --surface:#0F2230; --sunk:#0B1B26; --ink:#E6F0F3; --muted:#9DB0BF; --line:#21394A;
  --brand:#2CC4B2; --brand-ink:#04211D; --accent:#2CC4B2; --accent-ink:#04211D; --accent-soft:#0F3A38; --mint:#123F3D;
  --lost:#FF8A80; --lost-soft:#3B1714; --ok:#5DD39E; --ok-soft:#12301F; --warn:#FDB022; --warn-soft:#3A2A0A; --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081620; --surface:#0F2230; --sunk:#0B1B26; --ink:#E6F0F3; --muted:#9DB0BF; --line:#21394A;
  --brand:#2CC4B2; --brand-ink:#04211D; --accent:#2CC4B2; --accent-ink:#04211D; --accent-soft:#0F3A38; --mint:#123F3D;
  --lost:#FF8A80; --lost-soft:#3B1714; --ok:#5DD39E; --ok-soft:#12301F; --warn:#FDB022; --warn-soft:#3A2A0A; --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-0.02em;text-wrap:balance;line-height:1.15}
h1{font-size:28px} h2{font-size:21px}
a{color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--surface);display:flex;flex-direction:column;
  border-left:1px solid var(--line);border-right:1px solid var(--line);margin-inline:auto}
.app.wide{max-width:none;border:0;background:var(--surface);margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)))}
@media (max-width:512px){.app{border:0;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));max-width:none}}

.bar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:6px;min-height:58px;padding:0 12px}
.bar h2{font-size:19px;font-weight:600;font-family:var(--f-body);letter-spacing:0}
.bar.brand{min-height:48px;padding:0 20px;justify-content:space-between}
.logo{font-family:var(--f-display);font-weight:700;font-size:20px;display:inline-flex;align-items:center;gap:8px;color:var(--ink);letter-spacing:-0.02em;text-decoration:none}
.logo b{color:var(--brand);font-weight:700}
.logo-mark{width:32px;height:32px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.logo-mark svg{width:20px;height:20px}
.icon-btn{width:44px;height:44px;border:0;background:none;color:var(--ink);display:grid;place-items:center;border-radius:12px;cursor:pointer}
.icon-btn:hover{background:var(--sunk)}

.screen{flex:1;display:flex;flex-direction:column;gap:18px;padding:22px 20px 104px}
.spacer{flex:1;min-height:8px}
.lead{font-size:18px}
.muted{color:var(--muted);font-size:15px}
.center{text-align:center}
.section-h{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 22px;border-radius:999px;
  border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:700 17px/1.2 var(--f-body);text-decoration:none;cursor:pointer;text-align:center}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface);color:var(--ink)}
.btn.sec:hover{background:var(--sunk);filter:none}
.btn.danger{background:var(--lost);border-color:var(--lost);color:#fff}
.btn.dashed{border-style:dashed;background:transparent;color:var(--ink)}
.btn.small{min-height:44px;font-size:16px;padding:0 12px}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1;min-width:0;padding:0 10px}
.linkbtn{background:none;border:0;padding:8px;font:500 15px var(--f-body);color:var(--muted);text-decoration:underline;cursor:pointer;align-self:center}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.legend{font-weight:600;font-size:15px}
.input{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);color:var(--ink);font:400 17px var(--f-body)}
.input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{min-height:96px;resize:vertical}
.hint{font-size:14px;color:var(--muted)}
.err{font-size:14px;color:var(--lost);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>*{min-width:0}

.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{position:relative}
.pill input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pill span{display:flex;align-items:center;min-height:44px;padding:0 18px;border:1.5px solid var(--line);border-radius:22px;font-weight:600}
.pill input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.pill input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}

.toggles{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:62px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tg small{display:block;color:var(--muted);font-size:14px}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw:checked{background:var(--brand)}
.sw:checked::after{left:24px}

.note{border-radius:12px;padding:14px 16px;background:var(--sunk);font-size:15px;display:flex;flex-direction:column;gap:4px}
.note b{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.note.med{background:var(--accent-soft)}
.note.med b{color:var(--ink)}
.note.warn{background:var(--warn-soft)}
.note.warn b{color:var(--warn)}
.note ul{margin:2px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:2px}

.photo{border-radius:var(--r);background:var(--mint);color:var(--brand);display:grid;place-items:center;overflow:hidden;position:relative;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo svg{width:42%;height:auto;opacity:.85}

.card{border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:14px}
.pet-row{display:flex;gap:14px;align-items:center}
.pet-row>div:last-child{min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.lost{background:var(--lost-soft);color:var(--lost);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}

/* Fotos guiadas */
.meter-card{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.meter-top strong{font-family:var(--f-display);font-size:22px}
.meter{display:flex;gap:4px}
.meter span{flex:1;height:10px;border-radius:5px;background:var(--line)}
.meter span.req.on{background:var(--brand)}
.meter span.rec.on{background:var(--accent)}
.meter-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.meter-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.shots{display:flex;flex-direction:column;gap:12px}
.shot{border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.shot.ok{border-color:var(--ok)}
.shot.warn{border-color:var(--warn)}
.shot-head{display:flex;gap:12px;align-items:flex-start}
.shot-ic{width:56px;height:56px;flex:none;border-radius:12px;background:var(--sunk);display:grid;place-items:center;color:var(--ink)}
.shot-head>div{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.shot-title{font-weight:700;font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.shot-thumb{width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--sunk);max-width:100%;position:relative}
.shot-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.shot-thumb .tagx{position:absolute;left:8px;top:8px}
.issues{margin:0;padding-left:20px;color:var(--warn);font-size:15px;font-weight:500;display:flex;flex-direction:column;gap:4px}
.busy{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600}
.busy::before{content:"";width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Búsqueda por foto */
.drop{border:2px dashed var(--line);border-radius:16px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center;background:var(--sunk);cursor:pointer;color:var(--muted);font-weight:600}
.drop svg{color:var(--ink)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair>div{min-width:0;display:flex;flex-direction:column;gap:4px}
.thumb{aspect-ratio:1;border-radius:12px;overflow:hidden;display:grid;place-items:center;max-width:100%;color:#1F1800}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:45%;height:auto;opacity:.8}
.cap{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.rank{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--muted)}

.tag{align-self:center;background:var(--accent);color:var(--accent-ink);border-radius:28px;padding:22px 22px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;
  border:3px solid var(--ink);position:relative;width:min(280px,100%)}
.tag::before{content:"";width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);position:absolute;top:-12px;left:50%;transform:translateX(-50%)}
.tag .qr{background:#fff;padding:12px;border-radius:12px;width:100%;max-width:220px}
.tag .qr svg{display:block;width:100%;height:auto}
.code{font-family:var(--f-mono);font-weight:700;letter-spacing:.12em;font-size:18px}

.lostband{background:var(--lost);color:#fff;padding:20px 20px 18px;display:flex;flex-direction:column;gap:2px}
.lostband strong{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1.1}
.ownerband{background:var(--lost-soft);color:var(--lost);padding:14px 20px;display:flex;flex-direction:column;gap:2px;font-weight:600}
.ownerband strong{font-family:var(--f-display);font-size:22px}

.list{display:flex;flex-direction:column}
.li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.msg{border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg q{font-size:17px}
.mail-head{border-bottom:1px solid var(--line);padding-bottom:14px;display:flex;flex-direction:column;gap:4px}
.phonebox{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--ink);border-radius:var(--r);padding:12px 14px}
.phonebox span{font-family:var(--f-mono);font-weight:700;font-size:20px;user-select:all}

.big-ic{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft)}
.big-ic.ok{background:var(--ok-soft);color:var(--ok)}

.fab{position:fixed;right:calc(16px + env(safe-area-inset-right, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));z-index:40;
  display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:24px;border:0;background:var(--accent);color:var(--accent-ink);
  font:700 15px var(--f-body);box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}
.fab .num{font-family:var(--f-mono);font-size:13px}
.sheet-wrap{position:fixed;inset:0;z-index:30;cursor:pointer;background:rgba(10,15,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{cursor:auto;background:var(--surface);width:100%;max-width:440px;max-height:85%;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px max(18px, env(safe-area-inset-right, 0px)) calc(84px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.group{display:flex;flex-direction:column;gap:2px}
.group h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 0}
.jump{display:flex;gap:12px;align-items:center;min-height:46px;padding:0 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:500}
.jump:hover{background:var(--sunk)}
.jump.on{background:var(--accent-soft);font-weight:700}
.jump .n{font-family:var(--f-mono);font-size:13px;color:var(--muted);width:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom, 0px));z-index:50;background:var(--ink);color:var(--surface);
  padding:12px 18px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
/* Página principal */
.site-head{position:sticky;top:env(safe-area-inset-top, 0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.site-head .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:18px;min-height:70px;padding:0 20px}
.site-nav{display:flex;gap:24px;margin-left:auto}
.site-nav a{text-decoration:none;font-weight:700;font-size:15px;color:var(--ink);padding:8px 0;border-bottom:3px solid transparent}
.site-nav a.on{border-bottom-color:var(--accent)}
.head-cta{display:flex;gap:10px}
.head-cta .btn{width:auto;min-height:44px;font-size:15px;padding:0 18px}
@media (max-width:1000px){.site-nav{display:none}.head-cta{margin-left:auto}}
@media (max-width:560px){.head-cta .btn.reg{display:none}}
.home section{padding:56px 20px;scroll-margin-top:72px}
.home .in{max-width:1080px;margin:0 auto}
.band{background:var(--accent-soft)}
.hero{overflow:hidden}
.hero .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:center}
@media (max-width:860px){.hero .in{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--brand)}
.hero h1{font-size:clamp(36px,6vw,58px);line-height:1.05;margin:14px 0 20px}
.hero h1 em{font-style:normal;color:var(--brand);position:relative;display:inline-block}
.hero h1 em::after{content:"";position:absolute;left:2%;right:-4%;bottom:-8px;height:7px;border-radius:7px;background:var(--accent);opacity:.6}
.hero .lead{font-size:19px;max-width:34em}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.hero-ctas .btn{width:auto}
.ico svg{width:20px;height:20px;display:block}
.hero-art{position:relative;padding:18px 0 8px}
.hero-art::before{content:"";position:absolute;inset:0 -12% 14% 10%;border-radius:46% 54% 42% 58%/56% 44% 56% 44%;background:var(--mint)}
.hero-photo{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:442/212;max-width:100%}
.hero-photo img{width:100%;height:100%;object-fit:cover;display:block}
.mini-id{position:relative;margin:-54px 10px 0 auto;width:min(340px,94%);background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);padding:14px;display:grid;grid-template-columns:72px minmax(0,1fr) 68px;gap:12px;align-items:center}
.mini-id>*{min-width:0}
.mini-id img{width:72px;height:72px;border-radius:12px;object-fit:cover;display:block}
.mini-id .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:800;display:block}
.mini-id .v{font-family:var(--f-display);font-weight:700;font-size:15px;display:block;overflow-wrap:anywhere}
@media (max-width:560px){.mini-id{margin-top:-28px;grid-template-columns:60px minmax(0,1fr) 56px}.mini-id img{width:60px;height:60px}}
.mini-qr{background:#fff;padding:4px;border-radius:8px}
.mini-qr svg{display:block;width:100%;height:auto}
.sec-title{text-align:center;display:flex;flex-direction:column;gap:8px;margin-bottom:34px;align-items:center}
.sec-title h2{font-size:clamp(26px,4vw,36px)}
.sec-title p{max-width:40em}
.lostfound{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.lostfound{grid-template-columns:minmax(0,1fr)}}
.lf-card{background:var(--surface);border-radius:24px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.lf-card h3{font-size:21px}
.lf-card .btn{width:auto}
.round-ic{width:60px;height:60px;border-radius:50%;background:var(--accent-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.round-ic svg{width:28px;height:28px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
@media (max-width:860px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;font-weight:600}
.step-ic{width:100px;height:100px;border-radius:50%;background:var(--accent-soft);color:var(--brand);display:grid;place-items:center;position:relative}
.step-ic svg{width:44px;height:44px}
.step-n{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font:700 14px var(--f-display);display:grid;place-items:center}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:stretch}
@media (max-width:900px){.plans{grid-template-columns:minmax(0,1fr);max-width:460px;margin:0 auto}}
.plan{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;scroll-margin-top:90px}
.plan-head{padding:22px 22px 4px;display:flex;align-items:center;gap:10px;font:700 20px var(--f-display)}
.plan-head svg{width:26px;height:26px;color:var(--brand)}
.plan.featured{border:2px solid var(--brand)}
.plan.featured .plan-head{background:var(--brand);color:var(--brand-ink);padding:18px 22px}
.plan.featured .plan-head svg{color:var(--brand-ink)}
.plan ul{list-style:none;margin:0;padding:16px 22px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.plan li{display:flex;gap:10px;align-items:flex-start}
.plan li svg{flex:none;width:20px;height:20px;color:var(--brand);margin-top:1px}
.plan-foot{padding:16px 22px 22px;display:flex;flex-direction:column;gap:12px;align-items:center;border-top:1px solid var(--line)}
.price{font-family:var(--f-display);font-weight:700;font-size:30px}
.price small{font-size:15px;font-weight:600;color:var(--muted)}
.faq{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 18px}
.faq summary{cursor:pointer;font-weight:700;padding:16px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:700 20px var(--f-display);color:var(--brand)}
.faq details[open] summary::after{content:"−"}
.faq details p{padding:0 0 16px;color:var(--muted)}
.site-foot{background:var(--ink);color:var(--surface);padding:36px 20px calc(36px + 64px)}
.site-foot .in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:18px 36px;justify-content:space-between;align-items:flex-start}
.site-foot .logo,.site-foot .logo b{color:var(--surface)}
.site-foot .logo-mark{background:var(--surface);color:var(--ink)}
.foot-links{display:flex;flex-direction:column;gap:8px}
.foot-links a,.foot-links button{color:var(--surface);background:none;border:0;padding:0;font:600 15px var(--f-body);text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.site-foot p{font-size:14px;opacity:.85;max-width:34em}
/* Cuenta, verificación y administración */
.otp{font-family:var(--f-mono);font-size:28px;letter-spacing:.5em;text-align:center}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--brand);flex:none;margin:0}
.prefix{display:flex;gap:8px}
.prefix span{display:grid;place-items:center;min-width:64px;border:1.5px solid var(--line);border-radius:12px;font-weight:700;background:var(--sunk)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:14px;padding:12px 14px}
.stat b{font-family:var(--f-display);font-size:24px;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.menu-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.menu-list button,.menu-list a{display:flex;justify-content:space-between;align-items:center;min-height:54px;background:none;border:0;border-bottom:1px solid var(--line);font:600 16px var(--f-body);color:var(--ink);cursor:pointer;padding:0 4px;text-align:left;text-decoration:none}
.menu-list span:last-child{color:var(--muted)}
.ok-card{border:2px solid var(--ok);background:var(--ok-soft);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
/* Versión web: barra superior, menú lateral y tarjetas */
.web-only{display:none}
.auth-side{display:none}
@media (min-width:900px){
  .app{max-width:none;border:0;background:var(--bg);margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)))}
  .site-head.web-only{display:block}
  .side.web-only{display:flex}
  .mob-only{display:none!important}
  .shell{flex:1;display:flex;flex-direction:column}
  .shell-body{width:100%;max-width:1200px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;padding:28px 24px 0}
  .shell-public .shell-body{display:block;max-width:780px}
  .shell-main{min-width:0}
  .shell-main>.bar{position:static;background:none;border:0;padding:0 0 10px;min-height:auto}
  .shell-main>.bar h2{font:700 26px/1.2 var(--f-display);letter-spacing:-.02em}
  .shell-main .screen{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line);padding:28px 32px 32px;margin-bottom:96px}
  .shell-main .lostband,.shell-main .ownerband{border-radius:24px 24px 0 0}
  .shell-main .lostband+.screen,.shell-main .ownerband+.screen{border-top-left-radius:0;border-top-right-radius:0}
  .side{position:sticky;top:96px;align-self:start;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
  .side nav{display:flex;flex-direction:column;gap:2px}
  .side nav a,.side nav button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:12px;text-decoration:none;color:var(--ink);font:700 15px var(--f-body);background:none;border:0;cursor:pointer;text-align:left}
  .side nav a:hover,.side nav button:hover{background:var(--sunk)}
  .side nav a.on{background:var(--accent-soft);color:var(--brand)}
  .side svg{width:20px;height:20px;flex:none}
  .side-pet{display:flex;gap:10px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .side-pet img{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none}
  .side-pet>div{display:flex;flex-direction:column;min-width:0}
  .side-pet .mono{font-size:12px;color:var(--muted)}
  .side-plan{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
  .side-plan .linkbtn{padding:4px 0;align-self:flex-start}
  .user-chip{display:inline-flex;align-items:center;gap:8px;font-weight:700;padding:0 6px}
  .user-chip svg{width:22px;height:22px;color:var(--brand)}
  .shots,.pets,.results,.entries{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .dni-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
  .shell-auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .auth-side{display:flex;flex-direction:column;gap:22px;justify-content:center;background:var(--mint);padding:48px clamp(32px,5vw,72px)}
  .auth-side h2{font-size:clamp(32px,3.4vw,44px);line-height:1.08}
  .auth-side h2 em{font-style:normal;color:var(--brand)}
  .auth-side p{font-size:18px;max-width:30em}
  .shell-auth .shell-main{display:flex;flex-direction:column;align-items:center;padding:48px 24px;background:var(--surface)}
  .shell-auth .shell-main>*{width:100%;max-width:520px}
  .shell-auth .shell-main .screen{box-shadow:none;border:0;padding:0;background:none}
  .shell-auth .shell-main>.bar{padding-bottom:16px}
}
/* DNI de la mascota */
.idcard{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.id-head{background:var(--brand);color:var(--brand-ink);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.id-head .logo,.id-head .logo b{color:var(--brand-ink);font-size:17px}
.id-head .logo-mark{background:var(--brand-ink);color:var(--brand);width:26px;height:26px}
.id-head small{font-size:11px;font-weight:700;letter-spacing:.08em}
.id-body{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:14px}
.id-body>*{min-width:0}
.id-photo{aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--mint);color:var(--brand);display:grid;place-items:center;max-width:100%}
.id-photo img{width:100%;height:100%;object-fit:cover}
.id-photo svg{width:50%}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dl dd{margin:0;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.dl .wide{grid-column:1/-1}
.id-foot{border-top:1.5px dashed var(--line);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.id-foot>div:first-child{min-width:0;display:flex;flex-direction:column;gap:2px}
.id-qr{width:78px;flex:none;background:#fff;padding:5px;border-radius:8px}
.id-qr svg{display:block;width:100%;height:auto}
.mono{font-family:var(--f-mono);font-weight:700;letter-spacing:.06em}
/* Salud */
.entry{border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.entry-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.entry-top strong{font-size:17px}
.carne{width:88px;aspect-ratio:4/3;border-radius:8px;overflow:hidden;max-width:100%}
.carne img{width:100%;height:100%;object-fit:cover}

function progress(){
  const sp=S.pet.species,R=reqFor(sp),C=recFor(sp),sh=S.pet.shots;
  const done=k=>!!(sh[k]&&sh[k].src&&sh[k].status!=='revisar');
  const rd=R.filter(done).length,cd=C.filter(done).length,active=rd===R.length;
  let label,text;
  if(!active){label='Incompleto';text=`Faltan ${R.length-rd} ${R.length-rd===1?'foto obligatoria':'fotos obligatorias'}. Sin ellas, ${name()} no aparece en la búsqueda por foto.`}
  else if(cd===0){label='Mínimo completo';text=`${name()} ya aparece en la búsqueda por foto. Cada foto recomendada agrega rasgos para compararlo.`}
  else if(cd<C.length){label='Bueno';text=`Te ${C.length-cd===1?'falta 1 foto recomendada':'faltan '+(C.length-cd)+' fotos recomendadas'}.`}
  else{label='Completo';text='Tiene todas las tomas que pedimos. Actualízalas si cambia su corte de pelo.'}
  return {R,C,rd,cd,active,label,text,done};
}

function qr(code){
  let seed=0;for(const c of code)seed=(seed*31+c.charCodeAt(0))>>>0;
  const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
  const N=25;let r='';
  const inFinder=(x,y)=>(x<8&&y<8)||(x>=N-8&&y<8)||(x<8&&y>=N-8);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(inFinder(x,y))continue;if(rnd()<0.48)r+=`<rect x="${x}" y="${y}" width="1" height="1"></rect>`}
  const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"></rect><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"></rect><rect x="${x+2}" y="${y+2}" width="3" height="3"></rect>`;
  return `<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" fill="#111" role="img" aria-label="Código QR de la placa ${esc(code)}">${f(0,0)}${f(N-7,0)}${f(0,N-7)}${r}</svg>`;
}

/* Revisión automática de cada foto: tamaño, luz y enfoque. Redibujar en canvas quita los metadatos EXIF (incluido el GPS). */
function analyze(file){return new Promise((res,rej)=>{
  if(!file||!file.type||!file.type.startsWith('image/'))return rej('tipo');
  const fr=new FileReader();fr.onerror=()=>rej('leer');
  fr.onload=()=>{const img=new Image();img.onerror=()=>rej('img');img.onload=()=>{
    const issues=[],w=img.naturalWidth,h=img.naturalHeight;
    if(Math.min(w,h)<600)issues.push('Es pequeña (menos de 600 px de lado). Acércate más o usa la cámara en lugar de una captura de pantalla.');
    const sc=Math.min(1,1000/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);const src=c.toDataURL('image/jpeg',0.85);
    const W=320,H=Math.max(3,Math.round(h*W/w));const g=document.createElement('canvas');g.width=W;g.height=H;
    const gx=g.getContext('2d',{willReadFrequently:true});gx.drawImage(img,0,0,W,H);const d=gx.getImageData(0,0,W,H).data;
    const L=new Float32Array(W*H);let sum=0;for(let i=0;i<W*H;i++){const v=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];L[i]=v;sum+=v}
    const mean=sum/(W*H);
    if(mean<55)issues.push('Está oscura. Tómala con luz de día y sin flash.');else if(mean>215)issues.push('Está muy clara o tiene reflejo. Evita el sol directo y el flash.');
    let n=0,s1=0,s2=0;for(let yy=1;yy<H-1;yy++)for(let xx=1;xx<W-1;xx++){const i=yy*W+xx;const lap=L[i-1]+L[i+1]+L[i-W]+L[i+W]-4*L[i];s1+=lap;s2+=lap*lap;n++}
    const vr=n?s2/n-(s1/n)*(s1/n):0;
    if(vr<30)issues.push('Parece movida o desenfocada. Sostén el teléfono quieto y toca la pantalla sobre la mascota para enfocar.');
    res({src,issues});};img.src=fr.result};
  fr.readAsDataURL(file);})}

function sampleImg(k,i){
  const pal=['#F2C230','#E8C9A6','#CFE3D4','#D6DDF5','#F5D3C8','#E6E9EC','#EADCF3'];
  const c=document.createElement('canvas');c.width=800;c.height=600;const x=c.getContext('2d');
  x.fillStyle=pal[i%pal.length];x.fillRect(0,0,800,600);x.fillStyle='rgba(31,24,0,.82)';
  [[400,360,110,92],[262,250,48,60],[538,250,48,60],[335,150,44,56],[465,150,44,56]].forEach(e=>{x.beginPath();x.ellipse(e[0],e[1],e[2],e[3],0,0,Math.PI*2);x.fill()});
  x.font='700 30px system-ui, sans-serif';x.fillText('FOTO DE EJEMPLO',40,60);x.font='600 34px system-ui, sans-serif';x.fillText(SHOTS[k].t,40,560);
  return c.toDataURL('image/jpeg',0.8);
}

function shotCard(k,required){
  const s=S.pet.shots[k]||{},T=SHOTS[k];
  let chip,cls='';
  if(s.busy)chip='<span class="chip">Revisando…</span>';
  else if(s.src&&s.status==='revisar'){chip='<span class="chip warn">Revisar</span>';cls='warn'}
  else if(s.src&&s.status==='aceptada'){chip='<span class="chip warn">Usada con observaciones</span>';cls='warn'}
  else if(s.src){chip='<span class="chip ok">Lista</span>';cls='ok'}
  else chip=required?'<span class="chip">Falta</span>':'<span class="chip">Opcional</span>';
  const input=`<input class="vh" type="file" accept="image/*" id="shot-${k}" data-shot="${k}">`;
  let body='';
  if(s.busy)body='<p class="busy">Revisando tamaño, luz y enfoque</p>';

    body+= s.status==='revisar'
      ?`<div class="btn-row"><label class="btn small" for="shot-${k}">Tomar otra</label><button class="btn sec small" type="button" data-act="shot-keep" data-k="${k}">Usar igual</button></div>`

  } else body=`<label class="btn ${required?'':'sec'} small" for="shot-${k}">Tomar o subir foto</label>`;
  return `<article class="shot ${cls}" id="card-${k}"><div class="shot-head"><div class="shot-ic">${SHOT_IC[k]}</div><div><div class="shot-title">${esc(T.t)} ${chip}</div><p class="muted">${esc(T.d)}</p></div></div>${body}${input}</article>`;
}

function candidates(){
  const q=S.search,list=SAMPLES.filter(c=>c.species===q.species).map(c=>Object.assign({},c,{score:(c.color===q.color?2:0)+(c.district===q.district?1:0)}));
  if(S.isLost&&progress().active&&S.pet.species===q.species){const ck=colorKey(S.pet.color);
    list.push({toby:true,name:S.pet.name,species:S.pet.species,color:ck||'',district:S.lost.district,date:S.lost.date,score:(ck===q.color?2:0)+(S.lost.district===q.district?1:0)+0.5})}
  return list.sort((a,b)=>b.score-a.score).slice(0,4);
}

    <details><summary>¿El DNI PET ID es un documento oficial?</summary><p>No. Es una credencial privada de registro en PET ID. No reemplaza el registro municipal de canes ni documentos emitidos por una autoridad.</p></details>
    <details><summary>¿Qué ve una persona que escanea el QR de mi mascota?</summary><p>Su nombre, su foto, su número PET ID y si está extraviada. Tu DNI, dirección, teléfono y correo no se muestran, salvo que actives el teléfono.</p></details>
    <details><summary>¿Cómo funciona la búsqueda por foto?</summary><p>Quien encuentra una mascota sube su foto y la comparamos con las mascotas extraviadas de la zona. Mostramos las más parecidas y siempre confirma una persona: el parecido no es una identificación.</p></details>
    <details><summary>¿Por qué me piden varias fotos?</summary><p>La cara de frente, la cara de perfil y el cuerpo entero muestran rasgos distintos. Con esas tres fotos tu mascota entra en la búsqueda por foto.</p></details>
    <details><summary>¿Cuánto cuesta?</summary><p>El registro, el DNI digital, el QR, el reporte de extravío y la búsqueda por foto son gratuitos. El plan Premium agrega historial veterinario y recordatorios.</p></details>
  </div>
</div></section>
<footer class="site-foot"><div class="in">
  <div style="display:flex;flex-direction:column;gap:10px">${logo(false)}<p>El DNI PET ID es una credencial privada de registro y no es un documento oficial.</p></div>
  <div class="foot-links"><a href="#verificar">Verificar un certificado</a><button type="button" data-toast="Página de términos y condiciones">Términos y condiciones</button><button type="button" data-toast="Página de política de privacidad">Política de privacidad</button><button type="button" data-toast="Libro de reclamaciones virtual">Libro de reclamaciones</button></div>
  <div class="foot-links"><a href="#login">Iniciar sesión</a><a href="#crear-cuenta">Crear cuenta</a><a href="#admin">Acceso del equipo PET ID</a></div>
</div></footer>
</div>`,

login:()=>`${bar('Iniciar sesión','inicio')}<form class="screen" data-form="login" novalidate>
  <div style="padding-top:8px">${logo(false)}</div>
  <h1>Hola de nuevo</h1>
  <div class="field"><label for="l-email">Correo electrónico</label><input class="input" id="l-email" type="email" autocomplete="email" value="${esc(S.email)}"></div>
  <div class="field"><label for="l-pass">Contraseña</label><input class="input" id="l-pass" type="password" autocomplete="current-password" placeholder="Mínimo 8 caracteres"></div>
  <p class="err" id="login-err" hidden>Revisa tu correo y tu contraseña (mínimo 8 caracteres).</p>
  <button class="btn" type="submit">Ingresar</button>
  <button class="btn sec" type="button" data-act="passkey"><span class="ico">${ICO.face}</span>Ingresar con Face ID o huella</button>
  <button class="linkbtn" type="button" data-toast="Te enviamos un enlace para cambiar tu contraseña">¿Olvidaste tu contraseña?</button>
  <div class="spacer"></div>
  <p class="center muted">¿Aún no tienes cuenta? <a href="#crear-cuenta">Regístrate</a></p>
</form>`,

'crear-cuenta':()=>{const u=S.user;return `${bar('Crear cuenta','inicio')}<form class="screen" data-form="crear-cuenta" novalidate>
  <p class="muted">Paso 1 de 5: tu cuenta.</p>
  <div class="two"><div class="field"><label for="u-first">Nombres</label><input class="input" id="u-first" autocomplete="given-name" value="${esc(u.first)}"></div>
  <div class="field"><label for="u-last">Apellidos</label><input class="input" id="u-last" autocomplete="family-name" value="${esc(u.last)}"></div></div>
  <div class="two"><div class="field"><label for="u-doctype">Documento</label><select class="input" id="u-doctype">${['DNI','Carné de extranjería','Pasaporte'].map(o=>`<option ${o===u.docType?'selected':''}>${o}</option>`).join('')}</select></div>
  <div class="field"><label for="u-doc">Número</label><input class="input mono" id="u-doc" inputmode="numeric" value="${esc(u.doc)}"></div></div>
  <span class="hint" style="margin-top:-8px">Tu número de documento no aparece en el DNI de tu mascota ni en ninguna página pública.</span>
  <div class="field"><label for="u-birth">Fecha de nacimiento (opcional)</label><input class="input" id="u-birth" type="date" value="${esc(u.birth)}"></div>
  <div class="field"><label for="u-email">Correo electrónico</label><input class="input" id="u-email" type="email" autocomplete="email" value="${esc(S.email)}"></div>
  <div class="field"><label for="u-phone">Celular</label><div class="prefix"><span>+51</span><input class="input mono" id="u-phone" type="tel" inputmode="numeric" autocomplete="tel-national" value="${esc(S.phone)}"></div></div>
  <div class="two"><div class="field"><label for="u-dep">Departamento</label><select class="input" id="u-dep"><option>Lima</option></select></div>
  <div class="field"><label for="u-prov">Provincia</label><select class="input" id="u-prov"><option>Lima</option></select></div></div>
  <div class="field"><label for="u-dist">Distrito</label><select class="input" id="u-dist">${DISTRICTS.map(d=>`<option ${d===S.home?'selected':''}>${d}</option>`).join('')}</select></div>
  <div class="field"><label for="u-pass">Contraseña</label><input class="input" id="u-pass" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></div>
  <label class="check" for="c-terms"><input type="checkbox" id="c-terms"><span>Acepto los términos y condiciones.</span></label>
  <label class="check" for="c-priv"><input type="checkbox" id="c-priv"><span>Autorizo el tratamiento de mis datos personales según la política de privacidad.</span></label>
  <label class="check" for="c-news"><input type="checkbox" id="c-news"><span>Quiero recibir novedades y promociones (opcional).</span></label>
  <p class="err" id="u-err" hidden></p>
  <div class="spacer"></div>
  <button class="btn" type="submit">Crear cuenta</button>
  <p class="center muted">¿Ya tienes cuenta? <a href="#login">Inicia sesión</a></p>
</form>`},

otp:()=>`${bar('Verifica tu celular','crear-cuenta')}<form class="screen" data-form="otp" novalidate>
  <p class="muted">Paso 2 de 5: verificación.</p>
  <div class="round-ic" style="width:80px;height:80px">${ICO.phone}</div>
  <h1>Ingresa el código</h1>
  <p class="lead">Enviamos un código de 6 dígitos por SMS al +51 ${esc(S.phone)}.</p>
  <div class="field"><label for="otp-code">Código</label><input class="input otp" id="otp-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······"></div>
  <p class="hint">Prototipo: el código de prueba es 123456.</p>
  <p class="err" id="otp-err" hidden>El código no coincide. Revisa el SMS o pide uno nuevo.</p>
  <button class="btn" type="submit">Verificar</button>
  <button class="linkbtn" type="button" data-toast="Te enviamos un código nuevo">Reenviar código</button>
  <div class="note"><b>Correo</b>También te enviamos un enlace a ${esc(S.email)} para confirmar tu correo.</div>
</form>`,

verificar:()=>{const v=S.verify;return `${bar('Verificar certificado','inicio')}<form class="screen" data-form="verificar" novalidate>
  <p class="lead">Escribe el código de verificación que figura en el certificado o escanea su QR.</p>
  <div class="field"><label for="v-code">Código de verificación</label><input class="input mono" id="v-code" value="${esc(v&&v.code||'')}" placeholder="PID-XXXX-XXXX" autocapitalize="characters"></div>
  <button class="btn" type="submit">Verificar</button>
  ${v?(v.ok?`<section class="ok-card" aria-live="polite"><strong style="color:var(--ok)">Certificado válido</strong>
    <dl class="dl"><div><dt>N.° PET ID</dt><dd class="mono">${esc(S.petId)}</dd></div><div><dt>Estado del registro</dt><dd>${status().t}</dd></div>
    <div><dt>Mascota</dt><dd>${name()}, ${esc(S.pet.species.toLowerCase())}</dd></div><div><dt>Inscrita el</dt><dd>${fdate(S.registered)}</dd></div></dl>
    <p class="hint">Por privacidad no mostramos los datos del responsable.</p></section>`
    :`<div class="note warn" aria-live="polite"><b>No encontrado</b>No hay un certificado con ese código. Revisa que esté escrito igual que en el documento.</div>`):''}
  <p class="hint">Código del certificado de ejemplo: <span class="mono">${esc(S.certCode)}</span></p>
  <div class="spacer"></div>
  <p class="hint">El certificado acredita la inscripción en PET ID. No reemplaza documentos oficiales ni es por sí solo prueba definitiva de propiedad.</p>
</form>`},

admin:()=>{const A=S.admin,F=S.found;return `<header class="bar mob-only" style="padding:0 16px;justify-content:space-between">${logo(true)}<span class="chip">Administración</span></header><main class="screen">
  <h1>Panel de administración</h1>
  <p class="hint">Cifras de ejemplo.</p>
  <div class="stats"><div class="stat"><b>1.248</b><span>Mascotas registradas</span></div><div class="stat"><b>61 %</b><span>Con fotos completas</span></div><div class="stat"><b>9</b><span>Extravíos activos</span></div><div class="stat"><b>37</b><span>Búsquedas por foto esta semana</span></div></div>
  <h2 style="font-size:19px">Búsqueda por foto</h2>
  <div class="toggles">${sw('a-public',A.publicSearch,'Abierta al público','Actívala cuando la evaluación con fotos reales supere la línea base','data-admin="publicSearch"')}</div>
  <p class="muted">Mientras esté cerrada, la búsqueda solo la usa el equipo y las fotos se siguen indexando.</p>
  <h2 style="font-size:19px">Posibles duplicados</h2>
  ${A.dup?`<article class="card"><div class="pair"><div><span class="cap">PE-00000125</span>${thumb(IMG.dog,null,'Max')}</div><div><span class="cap">PE-00000311</span>${thumb(IMG.dog,null,'Maximiliano')}</div></div>
    <p class="muted">"Max" (cuenta de ${esc(S.ownerName)}) y "Maximiliano" (otra cuenta) tienen fotos muy parecidas.</p>
    <div class="btn-row"><button class="btn small" type="button" data-act="dup-same">Es la misma</button><button class="btn sec small" type="button" data-act="dup-diff">Son distintas</button></div></article>`:'<p class="muted">No hay duplicados pendientes.</p>'}
  <h2 style="font-size:19px">Coincidencias por revisar</h2>
  ${F?`<article class="card"><p>Hallazgo en ${esc(F.district)} parecido a ${name()}. Esperando la respuesta del dueño.</p></article>`:'<p class="muted">No hay coincidencias pendientes.</p>'}
  <h2 style="font-size:19px">Gestión</h2>
  <div class="menu-list">${['Usuarios','Mascotas','Solicitudes de verificación','Reportes de extravío','Planes y pagos','Veterinarias','Estadísticas','Auditoría de acciones','Contenidos'].map(x=>`<button type="button" data-toast="${x}: módulo del panel de administración"><span>${x}</span><span>›</span></button>`).join('')}</div>
</main>`},


registrar:()=>{const p=S.pet;return `${bar('Registrar mascota','otp')}<form class="screen" data-form="registrar" novalidate>
  <p class="muted">Paso 3 de 5: tu mascota. Después te pedimos fotos.</p>
  <div class="field"><label for="pet-name">Nombre</label><input class="input" id="pet-name" value="${esc(p.name)}" placeholder="Ej.: Max"></div>
  <p class="err" id="name-err" hidden>Escribe el nombre de tu mascota.</p>
  <fieldset style="border:0;padding:0;margin:0" class="field"><legend class="legend" style="margin-bottom:6px">Especie</legend><div class="pills">
   ${['Perro','Gato','Otro'].map((s,i)=>`<label class="pill"><input type="radio" name="species" id="sp-${i}" value="${s}" ${p.species===s?'checked':''}><span>${s}</span></label>`).join('')}</div>
   <span class="hint">Define qué fotos te pediremos.</span></fieldset>
  <fieldset style="border:0;padding:0;margin:0" class="field"><legend class="legend" style="margin-bottom:6px">Sexo</legend><div class="pills">
   ${['Macho','Hembra'].map((s,i)=>`<label class="pill"><input type="radio" name="sex" id="sx-${i}" value="${s}" ${p.sex===s?'checked':''}><span>${s}</span></label>`).join('')}</div></fieldset>
  <div class="two"><div class="field"><label for="pet-breed">Raza</label><input class="input" id="pet-breed" value="${esc(p.breed)}" placeholder="Ej.: mestizo"></div>
  <div class="field"><label for="pet-birth">Nacimiento (aprox.)</label><input class="input" type="date" id="pet-birth" value="${esc(p.birth)}"></div></div>
  <div class="field"><label for="pet-chip">N.° de microchip (opcional)</label><input class="input mono" id="pet-chip" inputmode="numeric" maxlength="15" value="${esc(p.chip)}" placeholder="15 dígitos"><span class="hint">Figura en el carné. Si no lo tienes, una veterinaria lo lee con un lector.</span></div>
  <p class="err" id="chip-err" hidden>El número de microchip tiene 15 dígitos, solo números.</p>
  <div class="field"><label for="pet-color">Color y señas</label><input class="input" id="pet-color" value="${esc(p.color)}" placeholder="Ej.: marrón con pecho blanco"></div>
  <div class="field"><label for="pet-alert">Alerta médica (opcional)</label><textarea class="input" id="pet-alert" placeholder="Ej.: es alérgico a la penicilina">${esc(p.alert)}</textarea><span class="hint">Lo que debe saber quien lo encuentre en las primeras horas.</span></div>
  <div class="spacer"></div>
  <button class="btn" type="submit">Continuar a las fotos</button>
</form>`},

fotos:()=>{const p=progress();const seg=p.R.map((k,i)=>`<span class="req${i<p.rd?' on':''}"></span>`).join('')+p.C.map((k,i)=>`<span class="rec${i<p.cd?' on':''}"></span>`).join('');
  return `${bar('Fotos de '+name(),'registrar')}<main class="screen">
  <p class="muted">Paso 4 de 5: fotos para reconocimiento.</p>
  <p class="lead">Con estas fotos comparamos a ${name()} con las mascotas que otras personas encuentran. Cada toma muestra rasgos distintos.</p>
  <section class="meter-card" aria-label="Estado de las fotos">
    <div class="meter-top"><strong>${p.label}</strong><span class="muted">Obligatorias ${p.rd} de ${p.R.length} · Recomendadas ${p.cd} de ${p.C.length}</span></div>
    <div class="meter" aria-hidden="true">${seg}</div>
    <div class="meter-legend"><span><i style="background:var(--ink)"></i>Obligatoria</span><span><i style="background:var(--accent)"></i>Recomendada</span></div>
    <p>${p.text}</p>
  </section>
  <div class="note"><b>Antes de empezar</b><ul><li>Luz de día, sin flash.</li><li>Una sola mascota en cada foto.</li><li>Fotos de este mes, no de cuando era cachorro.</li></ul></div>
  <h3 class="section-h">Obligatorias para ${esc(S.pet.species==='Otro'?'esta especie':S.pet.species.toLowerCase()+'s')}</h3>
  <div class="shots">${p.R.map(k=>shotCard(k,true)).join('')}</div>
  <h3 class="section-h">Recomendadas</h3>
  <div class="shots">${p.C.map(k=>shotCard(k,false)).join('')}</div>
  <p class="hint">Antes de guardar cada foto le quitamos la ubicación GPS y los demás datos internos del archivo.</p>
  <button class="btn dashed" type="button" data-act="samples">Usar fotos de ejemplo (para la prueba)</button>
  ${p.active?`<a class="btn" href="#privacidad">Guardar y continuar</a>`:`<a class="btn sec" href="#privacidad">Guardar y completar después</a><p class="hint center">Puedes seguir, pero la búsqueda por foto no se activa hasta tener las obligatorias.</p>`}
</main>`},

privacidad:()=>`${bar('Qué ve quien escanea','fotos')}<main class="screen">
  <p class="muted">Paso 5 de 5: privacidad.</p>
  <p class="lead">Elige qué aparece en la página de ${name()} cuando alguien escanea su placa.</p>
  <div class="toggles">
    <div class="tg"><span>Foto y nombre de ${name()}</span><span class="chip">Siempre</span></div>
    ${sw('v-alert',S.vis.alert,'Alerta médica',esc(S.pet.alert)||'No registraste ninguna','data-vis="alert"')}
    ${sw('v-owner',S.vis.owner,'Tu nombre',esc(S.ownerName),'data-vis="owner"')}
    ${sw('v-phone',S.vis.phone,'Tu teléfono',esc(S.phone),'data-vis="phone"')}
    ${sw('v-district',S.vis.district,'Distrito donde vive '+name(),esc(S.home),'data-vis="district"')}
    ${sw('v-rabies',S.vis.rabies,'Estado de la vacuna antirrábica','Según lo que registras en Vacunas y controles','data-vis="rabies"')}
  </div>
  <div class="note"><b>Nunca se muestra</b>Tu correo y tu dirección. Quien encuentra a ${name()} te escribe desde su página y el mensaje te llega por correo.</div>
  <div class="spacer"></div>
  <a class="btn sec" href="#perfil">Ver la página como la ve otra persona</a>
  <a class="btn" href="#placa" data-toast="Cambios guardados">Guardar</a>
</main>`,

placa:()=>`${bar('Placa de '+name(),'mis-mascotas')}<main class="screen" style="padding-top:32px">
  <div class="tag"><div class="qr">${qr(S.tag)}</div><span class="code">${esc(S.tag)}</span></div>
  <p class="lead center">Este código abre la página de ${name()}. Imprímelo y ponlo en su collar.</p>

  <p class="hint center">Si pierdes la placa, puedes desactivarla aquí y generar otra.</p>
</main>`,

'mis-mascotas':()=>{const p=progress(),st=status();return `<header class="bar mob-only" style="padding:0 16px">${logo(true)}</header>
<main class="screen">
  <div><p class="muted">Hola, ${esc(S.user.first)}</p><h1>Mis mascotas</h1></div>
  <div class="pets"><article class="card">
    <div class="pet-row"><div style="width:96px;flex:none">${photo(96)}</div><div>
      <h2 style="font-size:28px">${name()}</h2><p>${esc(S.pet.species)} · ${esc(S.pet.color)}</p>
      <div class="chips" style="margin-top:6px"><span class="chip ${st.cls}">${st.t}</span><span class="chip">Placa activa</span></div>
      <p class="mono" style="font-size:14px;margin-top:6px">${esc(S.petId)}</p>
    </div></div>
    <div class="chips">${p.active?`<span class="chip ok">Búsqueda por foto activa</span><span class="chip">Fotos: ${p.label.toLowerCase()}</span>`:`<span class="chip warn">Búsqueda por foto inactiva: faltan ${p.R.length-p.rd} fotos</span>`}</div>
    <p class="muted">La placa se escaneó ${S.scans.length} ${S.scans.length===1?'vez':'veces'}. Último escaneo: ${esc(S.scans[0]?S.scans[0].when:'ninguno')}.</p>
    ${(()=>{const n=nextDue();if(!n)return '';const st=hstat(n);return `<p class="muted">Próximo en salud: ${esc(n.title)}, ${fdate(n.next)} <span class="chip ${st.cls}">${st.t}</span></p>`})()}
    <div class="btn-row"><a class="btn sec small" href="#registrar">Editar</a><a class="btn sec small" href="#fotos">Fotos</a><a class="btn sec small" href="#placa">Placa QR</a></div>
    <div class="btn-row"><a class="btn sec small" href="#dni">DNI</a><a class="btn sec small" href="#salud">Vacunas y controles</a></div>
    ${S.isLost?`<a class="btn danger" href="#perdido">Ver el aviso de pérdida</a>`:`<a class="btn" href="#reportar">Reportar extravío</a>`}
  </article>
  <article class="card">
    <div class="pet-row"><div style="width:96px;flex:none"><div class="photo" style="height:96px"><img src="${IMG.cat}" alt="Foto de Luna"></div></div><div>
      <h2 style="font-size:28px">Luna</h2><p>Gato · Atigrado</p>
      <div class="chips" style="margin-top:6px"><span class="chip ok">Activa</span><span class="chip warn">Faltan 2 fotos</span></div>
      <p class="mono" style="font-size:14px;margin-top:6px">PE-00000126</p>
    </div></div>
    <div class="btn-row"><button class="btn sec small" type="button" data-act="another">DNI</button><button class="btn sec small" type="button" data-act="another">Fotos</button><button class="btn sec small" type="button" data-act="another">Vacunas</button></div>
  </article>
  </div>
  <button class="btn dashed" type="button" data-act="another">+ Registrar otra mascota</button>
  <h2 style="font-size:19px">Mi cuenta</h2>
  <div class="menu-list"><button type="button" data-toast="Datos de tu cuenta y documento de identidad"><span>Mi perfil</span><span>›</span></button><button type="button" data-toast="Elige si recibir avisos por correo, SMS o WhatsApp"><span>Notificaciones</span><span>›</span></button><button type="button" data-toast="Los pagos se habilitan en la fase 2"><span>Suscripción</span><span>PET ID Free ›</span></button><button type="button" data-toast="Contraseña, Face ID y sesiones abiertas"><span>Privacidad y seguridad</span><span>›</span></button><a href="#inicio"><span>Cerrar sesión</span><span>›</span></a></div>
  <p class="muted center">Te avisamos por correo cada vez que alguien escanea una placa o encuentra una mascota parecida.</p>
</main>`},

dni:()=>{const p=S.pet,r=rabies(),mp=mainPhoto();return `${bar('DNI de '+name(),'mis-mascotas')}<main class="screen">
  <div class="dni-grid"><section class="idcard" aria-label="DNI de ${name()}">
