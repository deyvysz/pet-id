        <div><dt>Raza</dt><dd>${esc(p.breed||'Sin dato')}</dd></div><div><dt>Nacimiento</dt><dd>${p.birth?fdate(p.birth):'Sin dato'}</dd></div>
        <div class="wide"><dt>Color y señas</dt><dd>${esc(p.color)}</dd></div>
        <div><dt>Registrado el</dt><dd>${fdate(S.registered)}</dd></div><div><dt>Estado</dt><dd>Registro activo</dd></div>
      </dl>
    </div>
    <div class="id-foot"><div><span class="cap">N.° PET ID</span><span class="mono" style="font-size:18px">${esc(S.petId)}</span><span class="cap" style="margin-top:6px">Responsable</span><span style="font-weight:700;display:inline-flex;align-items:center;gap:6px"><span style="color:var(--ok);display:inline-flex">${ICO.shield}</span>Identidad verificada</span><span class="hint">Datos personales protegidos</span></div><div class="id-qr">${qr(S.tag)}</div></div>
    <p class="hint" style="padding:0 14px 14px">No constituye documento oficial ni acreditación legal de propiedad.</p>
  </section>
  <dl class="dl card">
    <div class="wide"><dt>Microchip</dt><dd class="mono">${p.chip?esc(p.chip):'No registrado'}</dd></div>
    <div><dt>Placa QR</dt><dd class="mono">${esc(S.tag)}</dd></div><div><dt>Registrado el</dt><dd>${fdate(S.registered)}</dd></div>
    <div class="wide"><dt>Vacuna antirrábica</dt><dd>${r?`${r.e.next?'Próxima: '+fdate(r.e.next):'Aplicada el '+fdate(r.e.date)} <span class="chip ${r.cls}">${r.t}</span>`:'Sin registro'}</dd></div>
  </dl></div>
  ${p.chip?'':'<a class="linkbtn" href="#registrar">Agregar número de microchip</a>'}
  <article class="card"><h2 style="font-size:19px">Certificado de Registro e Identificación PET ID</h2>
    <p>N.° ${esc(S.petId)}. ${name()}, ${esc(p.species.toLowerCase())} ${esc(p.sex.toLowerCase())}, quedó inscrito en PET ID el ${fdate(S.registered)} a nombre de ${esc(S.ownerName)}.</p>
    <dl class="dl"><div><dt>Código de verificación</dt><dd class="mono">${esc(S.certCode)}</dd></div><div><dt>Emitido el</dt><dd>${fdate(S.registered)}</dd></div></dl>
    <a class="linkbtn" style="align-self:flex-start;padding-left:0" href="#verificar">Verificar este certificado</a>
    <p class="hint">El certificado acredita la inscripción en PET ID. No reemplaza documentos oficiales ni es por sí solo prueba definitiva de propiedad.</p></article>
  <div class="spacer"></div>
  <button class="btn" type="button" data-act="dl-doc" data-msg="En el producto, aquí se descarga el DNI en PDF">Descargar DNI (PDF)</button>
  <button class="btn sec" type="button" data-act="dl-doc" data-msg="En el producto, aquí se descarga el certificado en PDF">Descargar certificado (PDF)</button>
</main>`},

salud:()=>{const r=rabies(),n=nextDue(),list=S.health.slice().sort((a,b)=>b.date.localeCompare(a.date));return `${bar('Vacunas y controles','mis-mascotas')}<main class="screen">
  <section class="card">
    <div class="entry-top"><strong>Antirrábica</strong>${r?`<span class="chip ${r.cls}">${r.t}</span>`:'<span class="chip warn">Sin registro</span>'}</div>
    <p class="muted">${r?`Aplicada el ${fdate(r.e.date)}${r.e.next?'. Próxima: '+fdate(r.e.next):''}.`:`No registraste la vacuna antirrábica de ${name()}.`}</p>
    ${n?`<p class="muted">Lo próximo: ${esc(n.title)}, ${fdate(n.next)}.</p>`:''}
  </section>
  <button class="btn" type="button" data-act="new-entry">+ Registrar vacuna o control</button>
  <h3 class="section-h">Historial (${list.length})</h3>
  <div class="entries">${list.length?list.map(e=>{const st=hstat(e);return `<article class="entry">
    <div class="entry-top"><strong>${esc(e.title)}</strong><span class="chip ${st.cls}">${st.t}</span></div>
    <p class="muted">Aplicada el ${fdate(e.date)}${e.next?' · Próxima: '+fdate(e.next):''}</p>
    ${e.vet?`<p class="muted">${esc(e.vet)}</p>`:''}${e.notes?`<p>${esc(e.notes)}</p>`:''}
    ${e.carne?`<div class="carne"><img src="${e.carne}" alt="Foto del carné"></div>`:''}
    <p class="hint">Registrado por ${esc(S.ownerName)}</p></article>`}).join(''):`<p class="muted">Todavía no hay registros.</p>`}</div>
  <p class="hint">Estos registros los ingresas tú. Guarda la foto del carné como respaldo para mostrarla en la veterinaria.</p>
</main>`},

'salud-nuevo':()=>{const d=S.hdraft||(S.hdraft={type:'Vacuna',name:null,other:'',date:todayISO(),next:'',vet:'',notes:'',carne:null});
  const opts=d.type==='Vacuna'?(HV[S.pet.species]||HV.Otro):d.type==='Desparasitación'?['Interna','Externa (pulgas y garrapatas)']:['Control general','Otro'];
  if(!d.name||!opts.includes(d.name))d.name=opts[0];
  return `${bar('Registrar vacuna o control','salud')}<form class="screen" data-form="salud-nuevo" novalidate>
  <fieldset style="border:0;padding:0;margin:0" class="field"><legend class="legend" style="margin-bottom:6px">Tipo</legend><div class="pills">
   ${['Vacuna','Desparasitación','Control veterinario'].map((s,i)=>`<label class="pill"><input type="radio" name="h-type" id="ht-${i}" value="${s}" ${d.type===s?'checked':''}><span>${s}</span></label>`).join('')}</div></fieldset>
  <div class="field"><label for="h-name">${d.type==='Vacuna'?'Vacuna':d.type==='Desparasitación'?'Desparasitación':'Motivo'}</label><select class="input" id="h-name">${opts.map(o=>`<option ${o===d.name?'selected':''}>${o}</option>`).join('')}</select></div>
  ${/^Otr/.test(d.name)?`<div class="field"><label for="h-other">¿Cuál?</label><input class="input" id="h-other" value="${esc(d.other)}"></div>`:''}
  <div class="two"><div class="field"><label for="h-date">Fecha aplicada</label><input class="input" type="date" id="h-date" value="${esc(d.date)}" max="${todayISO()}"></div>
  <div class="field"><label for="h-next">Próxima dosis</label><input class="input" type="date" id="h-next" value="${esc(d.next)}"></div></div>
  <span class="hint" style="margin-top:-10px">Usa la próxima fecha que figura en el carné o la que te dio la veterinaria.</span>
  <p class="err" id="h-err" hidden></p>
  <div class="field"><label for="h-vet">Veterinaria o médico (opcional)</label><input class="input" id="h-vet" value="${esc(d.vet)}"></div>
  <div class="field"><span class="legend">Foto del carné (opcional)</span>
   ${d.carne?`<div class="carne" style="width:140px"><img src="${d.carne}" alt="Foto del carné"></div><label class="btn sec small" for="h-carne">Cambiar foto</label>`:`<label class="btn sec small" for="h-carne">Tomar o subir foto del carné</label>`}
   <input class="vh" type="file" accept="image/*" id="h-carne" data-carne></div>
  <div class="field"><label for="h-notes">Notas (opcional)</label><textarea class="input" id="h-notes" placeholder="Ej.: lote de la vacuna, peso, reacción">${esc(d.notes)}</textarea></div>
  <div class="spacer"></div>
  <button class="btn" type="submit">Guardar registro</button>
</form>`},

reportar:()=>{const L=S.lost,p=progress();return `${bar(name()+' se perdió','mis-mascotas')}<form class="screen" data-form="reportar" novalidate>
  <p class="lead">La página de ${name()} mostrará que está perdido a quien escanee su placa${p.active?', y aparecerá en la búsqueda por foto de tu zona':''}.</p>
  ${p.active?'':`<div class="note warn"><b>Sin búsqueda por foto</b>${name()} no tiene las fotos obligatorias, así que no aparecerá cuando alguien busque por foto.<a class="btn sec small" href="#fotos" style="margin-top:8px">Completar fotos</a></div>`}
  <div class="field"><label for="l-district">¿En qué distrito se perdió?</label><select class="input" id="l-district">${DISTRICTS.map(d=>`<option ${d===L.district?'selected':''}>${d}</option>`).join('')}</select></div>
  <div class="two"><div class="field"><label for="l-date">Fecha</label><input class="input" type="date" id="l-date" value="${esc(L.date)}"></div>
  <div class="field"><label for="l-time">Hora aprox.</label><input class="input" type="time" id="l-time" value="${esc(L.time)}"></div></div>
  <div class="field"><label for="l-msg">Mensaje para quien lo encuentre</label><textarea class="input" id="l-msg">${esc(L.msg)}</textarea></div>
  <div class="toggles">${sw('l-phone',L.showPhone,'Mostrar mi teléfono mientras esté perdido',esc(S.phone))}</div>
  <p class="muted">Solo mostramos el distrito. Tu dirección nunca aparece.</p>
  <div class="spacer"></div>
  <button class="btn danger" type="submit">Marcar como perdido</button>
</form>`},

aviso:()=>{const m=S.messages[0];return `${bar('Correo','perdido')}<main class="screen">
  <div class="mail-head"><span class="muted">De: Pet ID · ${esc(m?m.when:'Hoy')}</span><h1 style="font-size:26px">Alguien escaneó la placa de ${name()}</h1></div>
  <p class="lead">${m?`${esc(m.when)}: alguien abrió la página de ${name()}${m.where?` y compartió su ubicación aproximada: <strong>${esc(m.where)}</strong>`:''}.`:'Todavía no hay escaneos.'}</p>
  ${m?`<div class="msg"><span class="muted">Mensaje de quien lo encontró</span><q>${esc(m.text)}</q>${m.phone?`<span class="muted">Dejó su teléfono.</span>`:'<span class="muted">No dejó teléfono.</span>'}</div>`:''}
  <p class="muted">Si no fue un aviso real, puedes ignorar este correo. Quien escaneó no ve tu correo ni tu dirección.</p>
  <div class="spacer"></div>
  <a class="btn" href="#perdido">Ver el mensaje y responder</a>
  <button class="btn sec" type="button" data-act="found">Ya lo encontré</button>
</main>`},

perdido:()=>{const L=S.lost,F=S.found&&S.found.species===S.pet.species?S.found:null;return `<header class="bar mob-only" style="padding:0 20px"><h2 style="font-family:var(--f-display);font-weight:800;font-size:22px">Mis mascotas</h2></header>
<div class="ownerband"><strong>${name()} está perdido</strong><span>Desde el ${fdate(L.date)}, ${esc(L.time)} · ${esc(L.district)}</span></div>
<main class="screen">
  ${F?`<h2 style="font-size:19px">Mascota encontrada parecida a ${name()}</h2>
  <article class="card"><div class="pair"><div><span class="cap">${name()}</span>${thumb(mainPhoto(),null,'Foto de '+S.pet.name)}</div><div><span class="cap">Encontrada</span>${thumb(F.src,'var(--sunk)','Foto de la mascota encontrada')}</div></div>
   <p class="muted">${esc(F.when)} en ${esc(F.district)} · ${esc(F.species)}, ${esc(F.color.toLowerCase())}</p>
   <p class="hint">Compara orejas, manchas y color de ojos. El parecido no confirma que sea ${name()}.</p>
   ${F.contact?`<div class="phonebox"><span>${esc(F.contact)}</span><button class="btn sec" style="width:auto;min-height:40px" type="button" data-act="copy" data-v="${esc(F.contact)}">Copiar</button></div>`:'<p class="muted">Quien la encontró no dejó contacto. Te avisaremos si escribe.</p>'}
   <div class="btn-row"><button class="btn small" type="button" data-act="found">Es ${name()}</button><button class="btn sec small" type="button" data-act="not-match">No es</button></div></article>`:''}
  <h2 style="font-size:19px">Mensajes (${S.messages.length})</h2>
  ${S.messages.length?S.messages.map(m=>`<div class="msg"><span class="muted">${esc(m.when)}${m.where?' · cerca de '+esc(m.where):''}</span><q>${esc(m.text)}</q>
    ${m.phone?`<div class="phonebox"><span>${esc(m.phone)}</span><button class="btn sec" style="width:auto;min-height:40px" type="button" data-act="copy" data-v="${esc(m.phone)}">Copiar</button></div>`:'<span class="muted">No dejó teléfono.</span>'}</div>`).join('')
   :'<p class="muted">Aún no hay mensajes. Te avisaremos por correo.</p>'}
  <h2 style="font-size:19px">Escaneos de la placa</h2>
  <div class="list">${S.scans.map(s=>`<div class="li"><span>${esc(s.when)}</span><span class="muted">${s.where?'Ubicación compartida: '+esc(s.where):'Sin ubicación'}</span></div>`).join('')}</div>
  <p class="muted">La página pública muestra el aviso, el distrito${L.showPhone?' y tu teléfono':''}.${progress().active?' '+name()+' aparece en la búsqueda por foto de la zona.':''}</p>
  <div class="spacer"></div>
  <button class="btn" type="button" data-act="found">Ya lo encontré</button>
  <a class="btn sec" href="#reportar">Editar el aviso</a>
</main>`},

perfil:()=>`${brandBar()}<main class="screen">
  ${photo(300)}
  <h1 style="font-size:36px">Hola, soy ${name()}</h1>
  <p class="lead">${esc(S.pet.species)} · ${esc(S.pet.color)}</p>
  <p class="mono" style="font-size:14px">PET ID ${esc(S.petId)}</p>
  ${S.vis.alert&&S.pet.alert?`<div class="note med"><b>Alerta médica</b>${esc(S.pet.alert)}</div>`:''}
  ${S.vis.rabies?(()=>{const r=rabies();return `<div class="note"><b>Vacuna antirrábica</b>${!r?'Mi familia no registró esta vacuna.':r.cls==='lost'?'Vencida según el registro de mi familia.':r.e.next?'Al día hasta el '+fdate(r.e.next)+', según el registro de mi familia.':'Aplicada el '+fdate(r.e.date)+'.'}</div>`})():''}
  ${S.vis.owner||S.vis.district?`<p class="muted">${S.vis.owner?'Mi familia: '+esc(S.ownerName):''}${S.vis.owner&&S.vis.district?' · ':''}${S.vis.district?'Vivo en '+esc(S.home):''}</p>`:''}
  ${S.vis.phone?`<div class="phonebox"><span>${esc(S.phone)}</span><button class="btn sec" style="width:auto;min-height:40px" type="button" data-act="copy" data-v="${esc(S.phone)}">Copiar</button></div>`:''}
  <div class="spacer"></div>
  <a class="btn" href="#contactar">Encontré esta mascota</a>
  <p class="muted center">Tu mensaje llega al correo de mi familia. No necesitas registrarte.</p>
</main>`,

'perfil-perdido':()=>{const L=S.lost;return `<div class="lostband"><strong>Estoy perdido</strong><span>Desde el ${fdate(L.date)} en ${esc(L.district)}</span></div>
<main class="screen">
  <div class="pet-row"><div style="width:132px;flex:none">${photo(132)}</div><div><h1 style="font-size:32px">Soy ${name()}</h1><p>${esc(S.pet.species)} · ${esc(S.pet.color)}</p><p class="mono" style="font-size:14px">PET ID ${esc(S.petId)}</p></div></div>
  ${L.msg?`<div class="note"><b>Mensaje de mi familia</b>${esc(L.msg)}</div>`:''}
  ${S.vis.alert&&S.pet.alert?`<div class="note med"><b>Alerta médica</b>${esc(S.pet.alert)}</div>`:''}
  <div class="spacer"></div>
  <a class="btn danger" href="#contactar">Avisar que lo encontré</a>
  ${L.showPhone?`<button class="btn sec" type="button" data-act="show-phone" aria-expanded="false">Llamar a mi familia</button>
  <div class="phonebox" id="ownerphone" hidden><span>${esc(S.phone)}</span><button class="btn sec" style="width:auto;min-height:40px" type="button" data-act="copy" data-v="${esc(S.phone)}">Copiar</button></div>`:''}
  <p class="muted center">Si puedes, quédate con ${name()} hasta que respondan.</p>
</main>`},

contactar:()=>`${bar('Escribir a la familia de '+name(),S.isLost?'perfil-perdido':'perfil')}<form class="screen" data-form="contactar" novalidate>
  <div class="field"><label for="c-msg">Tu mensaje</label><textarea class="input" id="c-msg" style="min-height:140px" placeholder="Ej.: Lo encontré en Av. Angamos, cerca de una panadería. Lo tengo conmigo."></textarea></div>
  <p class="err" id="c-err" hidden>Escribe dónde está ${name()} o cómo encontrarte.</p>
  <div class="field"><label for="c-phone">Tu teléfono (opcional)</label><input class="input" id="c-phone" type="tel" inputmode="tel" placeholder="Para que te llamen"></div>
  <div class="toggles">${sw('c-loc',false,'Compartir mi ubicación aproximada','Solo el distrito, no la dirección')}</div>
  <div class="field" id="c-where-wrap" hidden><label for="c-where">¿En qué distrito estás?</label><select class="input" id="c-where">${DISTRICTS.map(d=>`<option ${d==='Surquillo'?'selected':''}>${d}</option>`).join('')}</select></div>
  <div class="note">La familia recibe tu mensaje por correo. Si no dejas tu teléfono, no podrá llamarte.</div>
  <div class="spacer"></div>
  <button class="btn" type="submit">Enviar mensaje</button>
</form>`,

enviado:()=>`<main class="screen" style="padding-top:64px">
  <div class="big-ic ok">${ic.check}</div>
  <h1>Mensaje enviado</h1>
  <p class="lead">La familia de ${name()} recibió tu aviso por correo.${S.lastSent&&S.lastSent.phone?' Dejaste tu teléfono, así que pueden llamarte.':' No dejaste teléfono: si quieres que te llamen, vuelve y escríbelo.'}</p>
  <div class="note"><b>Mientras esperas</b>Si puedes, deja a ${name()} en un lugar cerrado y con agua. No le des comida ni medicamentos.</div>
  <div class="spacer"></div>
  <a class="btn sec" href="#${S.isLost?'perfil-perdido':'perfil'}">Volver a la página de ${name()}</a>
  <a class="linkbtn" href="#aviso">Ver lo que recibe el dueño</a>
</main>`,

buscar:()=>{const q=S.search;let up;
  if(q.busy)up='<div class="drop"><p class="busy">Revisando tamaño, luz y enfoque</p></div>';
  else if(q.src)up=`<div class="shot ${q.issues.length?'warn':'ok'}"><div class="shot-thumb"><img src="${q.src}" alt="Foto de la mascota encontrada"></div>
    ${q.issues.length?`<ul class="issues">${q.issues.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p class="hint">Puedes buscar igual, pero con otra foto los resultados suelen ser mejores.</p>`:'<span class="chip ok" style="align-self:flex-start">Foto lista</span>'}
    <label class="btn sec small" for="find-photo">Cambiar foto</label></div>`;
  else up=`<label class="drop" for="find-photo">${ic.cam}<span>Tomar o subir una foto</span><span class="hint">Mejor si se ve la cara de frente.</span></label>`;
  return `${bar('Buscar por foto','inicio')}<form class="screen" data-form="buscar" novalidate>
  <p class="lead">Sube una foto de la mascota que encontraste. La comparamos con las mascotas reportadas como perdidas.</p>
  ${up}<input class="vh" type="file" accept="image/*" id="find-photo" data-find>
  <p class="err" id="f-err" hidden>Primero toma o sube una foto de la mascota.</p>
  <p class="hint">Encuadra solo a la mascota: que no salgan personas, placas de autos ni fachadas.</p>
  <fieldset style="border:0;padding:0;margin:0" class="field"><legend class="legend" style="margin-bottom:6px">Especie</legend><div class="pills">
   ${['Perro','Gato'].map((s,i)=>`<label class="pill"><input type="radio" name="f-species" id="fs-${i}" value="${s}" ${q.species===s?'checked':''}><span>${s}</span></label>`).join('')}</div></fieldset>
  <div class="two"><div class="field"><label for="f-color">Color principal</label><select class="input" id="f-color">${COLORS.map(c=>`<option ${c===q.color?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class="field"><label for="f-district">¿Dónde está?</label><select class="input" id="f-district">${DISTRICTS.map(d=>`<option ${d===q.district?'selected':''}>${d}</option>`).join('')}</select></div></div>
  <div class="field"><label for="f-contact">Tu teléfono o correo (opcional)</label><input class="input" id="f-contact" value="${esc(q.contact)}" placeholder="Para que la familia te contacte"></div>
  <div class="spacer"></div>
  <button class="btn" type="submit">Buscar parecidos</button>
</form>`},

resultados:()=>{const q=S.search,list=candidates();return `${bar('Parecidos reportados','buscar')}<main class="screen">
  <p class="lead">${list.length?`${list.length} ${list.length===1?'mascota perdida se parece':'mascotas perdidas se parecen'} a tu foto. La primera es la más parecida.`:'No hay mascotas perdidas de esa especie reportadas.'}</p>
  <div class="note warn"><b>No es una identificación</b>Compara las fotos tú mismo: orejas, manchas, color de ojos y cola.</div>
  <p class="hint">Resultados de ejemplo: el prototipo no tiene un modelo de reconocimiento.</p>
  <div class="results">${list.map((c,i)=>{const m=['especie'];if(c.color===q.color)m.push('color');if(c.district===q.district)m.push('distrito');
   return `<article class="card"><div class="meter-top"><span class="rank">${i+1} de ${list.length}</span><span class="muted">Perdido el ${fdate(c.date)} en ${esc(c.district)}</span></div>
    <div class="pair"><div><span class="cap">Tu foto</span>${thumb(q.src,'var(--sunk)','Tu foto')}</div><div><span class="cap">${esc(c.name)}</span>${thumb(c.toby?mainPhoto():null,c.toby?null:c.bg,'Foto de '+c.name)}</div></div>
    <p class="muted">Coincide en ${m.join(', ')}.${c.toby?'':' (Reporte de ejemplo.)'}</p>
    ${c.toby?`<a class="btn small" href="#perfil-perdido">Es este: ver su página</a>`:`<button class="btn sec small" type="button" data-act="sample-pet" data-n="${esc(c.name)}">Es este: ver su página</button>`}</article>`}).join('')}</div>
  <div class="spacer"></div>
  <button class="btn sec" type="button" data-act="publish-found">Ninguno es: publicar que la encontré</button>
</main>`},

hallazgo:()=>{const F=S.found||{};return `<main class="screen" style="padding-top:64px">
  <div class="big-ic ok">${ic.check}</div>
  <h1>Publicamos tu hallazgo</h1>
  <p class="lead">Si una familia reporta ${F.species==='Gato'?'un gato parecido':'un perro parecido'} en ${esc(F.district||'tu zona')} o cerca, le mostraremos tu foto${F.contact?' y tu contacto':''}.</p>
  ${F.contact?'':'<p class="muted">No dejaste teléfono ni correo, así que la familia no podrá escribirte. Vuelve y agrégalo si quieres que te contacten.</p>'}
  <div class="note"><b>Mientras esperas</b>Si puedes, deja a la mascota en un lugar cerrado y con agua. Una veterinaria cercana puede revisar si tiene microchip.</div>
  <div class="spacer"></div>
  <a class="btn sec" href="#buscar">Volver a la búsqueda</a>
  <a class="linkbtn" href="#perdido">Ver lo que recibe el dueño</a>
</main>`}
};

const app=document.getElementById('app');
let cur=V[location.hash.slice(1)]?location.hash.slice(1):'inicio';
function render(keep){
  const y=window.scrollY,L=LAYOUT[cur]||'public';app.classList.toggle('wide',L==='site');app.innerHTML=L==='site'?V[cur]():shell(L,V[cur]());window.scrollTo(0,keep?y:0);
  const i=SCREENS.findIndex(s=>s[0]===cur);
  document.getElementById('fab-num').textContent=String(i+1).padStart(2,'0')+'/'+SCREENS.length;
  renderSheet();
}
function renderSheet(){
  let out='',g=false;
  SCREENS.forEach((s,i)=>{if(s[2]){if(g)out+='</div>';out+=`<div class="group"><h3>${s[2]}</h3>`;g=true}
    out+=`<a class="jump${s[0]===cur?' on':''}" href="#${s[0]}"><span class="n">${String(i+1).padStart(2,'0')}</span>${s[1]}</a>`});
  document.getElementById('sheet-list').innerHTML=out+'</div>';
}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
const sheet=document.getElementById('sheet'),fab=document.getElementById('fab');
function fabSync(){const open=!sheet.hidden;document.getElementById('fab-label').textContent=open?'Cerrar':'Pantallas';fab.setAttribute('aria-expanded',String(open))}
function openSheet(){sheet.hidden=false;fabSync();const on=sheet.querySelector('.jump.on')||sheet.querySelector('.jump');on&&on.focus({preventScroll:true})}
function closeSheet(){sheet.hidden=true;fabSync()}
fab.addEventListener('click',e=>{e.stopPropagation();sheet.hidden?openSheet():closeSheet()});
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden){closeSheet();fab.focus()}});
const go=h=>{cur=V[h]?h:'inicio';render();try{if(location.hash!=='#'+cur)location.hash=cur}catch(err){}};
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
function keepForm(){if(!document.getElementById('pet-name'))return;S.pet.name=val('pet-name')||S.pet.name;S.pet.color=val('pet-color');S.pet.alert=val('pet-alert');
  S.pet.breed=val('pet-breed');S.pet.birth=val('pet-birth');S.pet.chip=val('pet-chip').replace(/\s/g,'');
  const sp=document.querySelector('input[name="species"]:checked');if(sp)S.pet.species=sp.value;
  const sx=document.querySelector('input[name="sex"]:checked');if(sx)S.pet.sex=sx.value}
function keepDraft(){if(!document.getElementById('h-date'))return;const d=S.hdraft||{};
  const ty=document.querySelector('input[name="h-type"]:checked');if(ty)d.type=ty.value;
  d.name=val('h-name');d.other=val('h-other');d.date=val('h-date');d.next=val('h-next');d.vet=val('h-vet');d.notes=val('h-notes');S.hdraft=d}
function keepSearch(){if(!document.getElementById('f-color'))return;const q=S.search;q.color=val('f-color');q.district=val('f-district');q.contact=val('f-contact');
  const sp=document.querySelector('input[name="f-species"]:checked');if(sp)q.species=sp.value}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-toast]');
  if(t&&t.dataset.toast)setTimeout(()=>toast(t.dataset.toast),50);
  const link=e.target.closest('a[href^="#"]');
  if(link){const h=link.getAttribute('href').slice(1);e.preventDefault();closeSheet();
    if(V[h])go(h);else{const el=document.getElementById(h);if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}return}
  if(!t)return;
  const a=t.dataset.act;
  if(a==='close-sheet'){closeSheet();fab.focus()}
  else if(a==='reset'){S=defaults();save();closeSheet();go('inicio');toast('Datos de ejemplo restaurados')}
  else if(a==='scenario'){fillSamples();S.isLost=true;S.search=defaults().search;S.found=null;save();closeSheet();go('buscar');toast(S.pet.name+' figura como extraviado en Miraflores y tiene fotos completas')}
  else if(a==='resend')toast('Enlace reenviado a '+S.email);
  else if(a==='pdf')toast('En el producto, aquí se descarga el PDF de la placa');
  else if(a==='another')toast('En el prototipo, las acciones están activas para '+S.pet.name);
  else if(a==='found'){S.isLost=false;S.recovered=true;S.found=null;save();go('mis-mascotas');setTimeout(()=>toast('Estado actualizado: encontrada'),60)}
  else if(a==='not-match'){S.found=null;save();render(true);toast('Descartamos esa coincidencia')}
  else if(a==='samples'){fillSamples();save();render(true);toast('Fotos de ejemplo cargadas')}
  else if(a==='shot-keep'){const s=S.pet.shots[t.dataset.k];if(s){s.status='aceptada';save();render(true)}}
  else if(a==='shot-rm'){delete S.pet.shots[t.dataset.k];save();render(true)}
  else if(a==='new-entry'){S.hdraft=null;go('salud-nuevo')}
  else if(a==='dl-doc')toast(t.dataset.msg);
  else if(a==='passkey'){go('mis-mascotas');setTimeout(()=>toast('Identidad confirmada con la biometría del teléfono (simulado)'),60)}
  else if(a==='dup-same'){S.admin.dup=false;save();render(true);toast('Marcado como duplicado: se pedirá verificación a las dos cuentas')}
  else if(a==='dup-diff'){S.admin.dup=false;save();render(true);toast('Marcadas como mascotas distintas')}
  else if(a==='sample-pet')toast('En el prototipo solo está la página de '+S.pet.name);
  else if(a==='publish-found'){const q=S.search;S.found={src:q.src,species:q.species,color:q.color,district:q.district,contact:q.contact,when:'Hoy, '+new Date().toTimeString().slice(0,5)};save();go('hallazgo')}
  else if(a==='show-phone'){const b=document.getElementById('ownerphone');b.hidden=!b.hidden;t.setAttribute('aria-expanded',String(!b.hidden))}
  else if(a==='copy'){const v=t.dataset.v;const ok=()=>toast('Copiado');
    try{navigator.clipboard.writeText(v).then(ok,()=>toast('Selecciona el texto para copiarlo'))}catch(err){toast('Selecciona el texto para copiarlo')}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.vis){S.vis[t.dataset.vis]=t.checked;save()}
  if(t.dataset.admin){S.admin[t.dataset.admin]=t.checked;save();toast(t.checked?'Búsqueda por foto abierta al público':'Búsqueda por foto solo para el equipo')}
  if(t.id==='c-loc'){document.getElementById('c-where-wrap').hidden=!t.checked}
  if(t.name==='h-type'){keepDraft();S.hdraft.name=null;render(true)}
  if(t.id==='h-name'){keepDraft();render(true)}
  if(t.hasAttribute('data-carne')&&t.files&&t.files[0]){keepDraft();
    analyze(t.files[0]).then(r=>{S.hdraft.carne=r.src;render(true)}).catch(()=>toast('No pudimos leer ese archivo. Elige una foto JPG o PNG.'))}
  if(t.dataset.shot&&t.files&&t.files[0]){
    const k=t.dataset.shot,f=t.files[0];S.pet.shots[k]={busy:true};render(true);
    analyze(f).then(r=>{S.pet.shots[k]={src:r.src,issues:r.issues,status:r.issues.length?'revisar':'ok'};save();render(true);
      toast(r.issues.length?'Revisa la foto: '+SHOTS[k].t.toLowerCase():SHOTS[k].t+': lista')})
     .catch(()=>{delete S.pet.shots[k];render(true);toast('No pudimos leer ese archivo. Elige una foto JPG o PNG.')});
  }
  if(t.hasAttribute('data-find')&&t.files&&t.files[0]){
    keepSearch();const q=S.search;q.busy=true;render(true);
    analyze(t.files[0]).then(r=>{q.busy=false;q.src=r.src;q.issues=r.issues;save();render(true)})
     .catch(()=>{q.busy=false;render(true);toast('No pudimos leer ese archivo. Elige una foto JPG o PNG.')});
  }
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const k=f.dataset.form;
  if(k==='login'){const em=val('l-email'),pw=document.getElementById('l-pass').value;const ok=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)&&pw.length>=8;document.getElementById('login-err').hidden=ok;if(!ok)return;S.email=em;save();go('mis-mascotas');setTimeout(()=>toast('Sesión iniciada'),60)}
  if(k==='crear-cuenta'){const er=document.getElementById('u-err'),fail=m=>{er.textContent=m;er.hidden=false;er.scrollIntoView({block:'center'})};
    const first=val('u-first'),last=val('u-last'),dt=val('u-doctype'),doc=val('u-doc').replace(/\s/g,''),em=val('u-email'),ph=val('u-phone').replace(/\s/g,''),pw=document.getElementById('u-pass').value;
    if(!first||!last)return fail('Escribe tus nombres y apellidos.');
    if(dt==='DNI'&&!/^\d{8}$/.test(doc))return fail('El DNI tiene 8 dígitos.');
    if(dt==='Carné de extranjería'&&!/^\d{9,12}$/.test(doc))return fail('El carné de extranjería tiene entre 9 y 12 dígitos.');
    if(dt==='Pasaporte'&&!/^[A-Za-z0-9]{6,12}$/.test(doc))return fail('Revisa el número de pasaporte.');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return fail('Escribe un correo con el formato nombre@correo.com.');
    if(!/^9\d{8}$/.test(ph))return fail('El celular tiene 9 dígitos y empieza con 9.');
    if(pw.length<8)return fail('La contraseña debe tener al menos 8 caracteres.');
    if(!document.getElementById('c-terms').checked||!document.getElementById('c-priv').checked)return fail('Para crear la cuenta acepta los términos y autoriza el tratamiento de tus datos.');
    S.user={first,last,docType:dt,doc,birth:val('u-birth')};S.ownerName=first.split(' ')[0]+' '+last.split(' ')[0];S.email=em;S.phone=ph.replace(/(\d{3})(\d{3})(\d{3})/,'$1 $2 $3');S.home=val('u-dist');save();go('otp')}
  if(k==='otp'){if(val('otp-code')!=='123456'){document.getElementById('otp-err').hidden=false;return}go('registrar');setTimeout(()=>toast('Celular verificado'),60)}
  if(k==='verificar'){const c=val('v-code').toUpperCase();S.verify={code:c,ok:c===S.certCode};render(true)}
  if(k==='registrar'){if(!val('pet-name')){document.getElementById('name-err').hidden=false;return}
    const ch=val('pet-chip').replace(/\s/g,'');if(ch&&!/^\d{15}$/.test(ch)){document.getElementById('chip-err').hidden=false;return}
    keepForm();save();go('fotos')}
  if(k==='salud-nuevo'){keepDraft();const d=S.hdraft,er=document.getElementById('h-err');
    const fail=m=>{er.textContent=m;er.hidden=false};
    if(!d.date)return fail('Indica la fecha en que se aplicó.');
    if(d.date>todayISO())return fail('La fecha aplicada no puede ser futura.');
    if(d.next&&d.next<=d.date)return fail('La próxima dosis debe ser posterior a la fecha aplicada.');
    if(/^Otr/.test(d.name)&&!d.other)return fail('Escribe cuál fue.');
    S.health.push({id:Date.now(),type:d.type,title:entryTitle(d),date:d.date,next:d.next,vet:d.vet,notes:d.notes,carne:d.carne||null});
    S.hdraft=null;save();go('salud');setTimeout(()=>toast('Registro guardado'),60)}
  if(k==='reportar'){S.lost={district:val('l-district'),date:val('l-date'),time:val('l-time'),msg:val('l-msg'),showPhone:document.getElementById('l-phone').checked};S.isLost=true;S.recovered=false;save();go('perdido');setTimeout(()=>toast('La página de '+S.pet.name+' ya muestra el aviso'),60)}
  if(k==='contactar'){const m=val('c-msg');if(!m){document.getElementById('c-err').hidden=false;return}
    const where=document.getElementById('c-loc').checked?val('c-where'):null;const ph=val('c-phone');
    S.lastSent={phone:ph};S.messages.unshift({when:'Ahora',text:m,phone:ph,where});S.scans.unshift({when:'Ahora',where});save();go('enviado')}
  if(k==='buscar'){keepSearch();if(!S.search.src){document.getElementById('f-err').hidden=false;return}save();go('resultados')}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(V[h]&&h!==cur){cur=h;closeSheet();render()}});
render();
})();
</script>
