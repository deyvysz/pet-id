---
# Piloto cerrado de PET ID: un servidor en Contabo (US East).
# Se administra solo por la VPN: el tunel WireGuard "petid-piloto" debe estar activo.
# La primera corrida (antes de que exista la VPN) entra por la IP publica:
#   ansible-playbook playbooks/site.yml --tags base,ssh,wireguard -e ansible_host=<IP publica>
all:
  vars:
    ansible_user: admin
  children:
    piloto:
      hosts:
        petid-piloto:
          ansible_host: 10.10.0.1
          # IP publica del VPS: se completa al contratarlo (panel de Contabo).
          public_ip: ""
          node_role: public
    wireguard_servers:
      hosts:
        petid-piloto:
    swarm_managers:
      hosts:
        petid-piloto:
