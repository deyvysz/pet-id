---
- name: Paquetes base
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - nftables
      - ca-certificates
      - curl
      - gnupg
      - jq
      - htop
      - python3-docker
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Parches de seguridad automaticos
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: No ofrecer saltos de version de Ubuntu (los servidores se quedan en 24.04)
  ansible.builtin.lineinfile:
    path: /etc/update-manager/release-upgrades
    regexp: "^Prompt="
    line: Prompt=never
  failed_when: false

- name: Nombre del servidor
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Zona horaria
  community.general.timezone:
    name: "{{ timezone }}"

