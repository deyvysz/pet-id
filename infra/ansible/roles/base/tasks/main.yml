---
- name: Paquetes base
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - nftables
      - ca-certificates
      - curl
      - gnupg
      - jq
      - htop
      - python3-docker
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Parches de seguridad automaticos
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: No ofrecer saltos de version de Ubuntu (los servidores se quedan en 24.04)
  ansible.builtin.lineinfile:
    path: /etc/update-manager/release-upgrades
    regexp: "^Prompt="
    line: Prompt=never
  failed_when: false

- name: Nombre del servidor
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Zona horaria
  community.general.timezone:
    name: "{{ timezone }}"


# Intercambio de respaldo: el servidor tiene 8 GB y los modelos de reconocimiento
# ocupan buena parte. Evita que el sistema mate procesos ante un pico corto.
- name: Archivo de intercambio de 2 GB
  ansible.builtin.shell: |
    set -e
    fallocate -l 2G /swapfile
    chmod 600 /swapfile
    mkswap /swapfile
  args:
    creates: /swapfile

- name: Intercambio activo al arrancar
  ansible.posix.mount:
    path: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present

- name: Activar el intercambio ahora
  ansible.builtin.command: swapon /swapfile
  register: base_swapon
  changed_when: base_swapon.rc == 0
  failed_when: false
  when: ansible_facts['swaptotal_mb'] | default(0) | int == 0

- name: Usar el intercambio solo cuando falte memoria
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    sysctl_file: /etc/sysctl.d/99-petid.conf
    reload: true
