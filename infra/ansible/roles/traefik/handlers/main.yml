---
# Mismo caso que "Servicio habilitado": en modo prueba, si el servicio aun no
# existe, systemd no lo puede reiniciar. Se salta solo en ese caso.
- name: Aplicar regla del 443
  ansible.builtin.systemd_service:
    name: docker-user-https
    state: restarted
    daemon_reload: true
  when: not (ansible_check_mode and traefik_https_unit.changed)
