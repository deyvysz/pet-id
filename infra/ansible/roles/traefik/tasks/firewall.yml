---
# Pieza 3: el puerto 443 de los servidores publicos solo acepta conexiones que
# vienen de Cloudflare. Va en DOCKER-USER porque los puertos que publica Docker
# no pasan por la cadena input del cortafuegos (rol firewall).
- name: Script de la regla del 443
  ansible.builtin.template:
    src: docker-user-https.sh.j2
    dest: /usr/local/sbin/docker-user-https.sh
    owner: root
    group: root
    mode: "0755"
  notify: Aplicar regla del 443

- name: Servicio que aplica la regla cada vez que arranca Docker
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker-user-https.service
    content: |
      # Administrado por Ansible (pet-id, rol traefik).
      [Unit]
      Description=Regla DOCKER-USER: el 443 solo desde Cloudflare
      After=docker.service
      PartOf=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/docker-user-https.sh

      [Install]
      WantedBy=docker.service
    owner: root
    group: root
    mode: "0644"
  register: traefik_https_unit
  notify: Aplicar regla del 443

# En modo prueba (--check) el archivo del servicio no se crea de verdad, asi que
# systemd todavia no lo conoce. Ese caso se salta; en la corrida real si corre.
- name: Servicio habilitado
  ansible.builtin.systemd_service:
    name: docker-user-https
    enabled: true
    daemon_reload: true
  when: not (ansible_check_mode and traefik_https_unit.changed)

# La regla tiene que estar activa antes de que Traefik abra el 443.
- name: Aplicar la regla ahora si cambio
  ansible.builtin.meta: flush_handlers
